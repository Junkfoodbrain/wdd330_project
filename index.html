<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Night Pairings</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <header>
        <h1>Movie Night Pairings</h1>
    </header>
    <main>
        <label for="genre-select">Choose a movie genre:</label>
        <select id="genre-select" name="genre">
            <option value="">Select a genre</option>
            <option value="35">Comedy</option>
            <option value="28">Action</option>
            <option value="12">Adventure</option>
            <option value="16">Animation</option>
            <option value="18">Drama</option>
            <option value="10749">Romance</option>
        </select>

        <div class="selection-layout">
            <section id="movie-section">
                <h2>Choose Your Movie</h2>
                <div id="movie-options"></div>
                <div id="movie-details"></div>
            </section>
            <section id="cuisine-section">
                <h2>Choose Your Cuisine</h2>
                <label for="cuisine-select">Cuisine:</label>
                <select id="cuisine-select" name="cuisine">
                    <option value="">Select a cuisine</option>
                </select>
                <div id="recipe-options"></div>
                <div id="recipe-details"></div>
            </section>
        </div>
        <section id="pairing-section">
            <h2>Your Movie Night Pairing</h2>
            <div id="pairing-details"></div>
        </section>
        <button id="start-over" type="button">Start Over</button>
    </main>
    <footer></footer>
    <script type="module" src="js/main.js"></script>
</body>

</html>
